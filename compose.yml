name: hh88trance

services:
  web:
    build:
      context: .
      target: web
    image: hh88trance-web:local
    container_name: hh88trance-web
    depends_on:
      api:
        condition: service_healthy
      downloads:
        condition: service_started
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_HTTP_PORT:-8080}:8080"
    networks:
      - proxy
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      target: api
    image: hh88trance-api:local
    container_name: hh88trance-api
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://storefront:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/storefront"
      DOWNLOAD_STORAGE_ROOT: /srv/storefront-media/products
      DOWNLOAD_PUBLIC_PREFIX: /download-file
      AUTO_MIGRATE: "false"
    volumes:
      - storefront_media:/srv/storefront-media/products:rw
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks:
      - backend
      - observability
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      target: api
    image: hh88trance-api:local
    container_name: hh88trance-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://storefront:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/storefront"
      DOWNLOAD_STORAGE_ROOT: /srv/storefront-media/products
      DOWNLOAD_PUBLIC_PREFIX: /download-file
      AUTO_MIGRATE: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storefront_media:/srv/storefront-media/products:rw
    networks:
      - backend
    restart: "no"
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    container_name: hh88trance-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: storefront
      POSTGRES_DB: storefront
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - backend
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storefront -d storefront"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  downloads:
    image: nginx:1.27-alpine
    container_name: hh88trance-downloads
    env_file:
      - .env
    environment:
      DOWNLOAD_URL_SECRET: "${DOWNLOAD_URL_SECRET:?set DOWNLOAD_URL_SECRET in .env}"
    volumes:
      - ./backend/deploy/nginx.downloads.conf.template:/etc/nginx/templates/default.conf.template:ro
      - storefront_media:/srv/storefront-media/products:ro
    expose:
      - "8080"
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: hh88trance-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://storefront:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/storefront?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9187"
    networks:
      - observability
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: hh88trance-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
    ports:
      - "${OBS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.4.0
    container_name: hh88trance-grafana
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3000}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "${OBS_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks:
      - observability
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
  backend:
    name: hh88trance-backend
    internal: true
  observability:
    name: hh88trance-observability

volumes:
  postgres_data:
    name: hh88trance-postgres-data
  storefront_media:
    name: hh88trance-storefront-media
  prometheus_data:
    name: hh88trance-prometheus-data
  grafana_data:
    name: hh88trance-grafana-data
