upstream api_backend {
  server api:8000;
}

upstream downloads_backend {
  server downloads:8080;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  location = /health {
    proxy_pass http://api_backend/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
  }

  location = /ready {
    proxy_pass http://api_backend/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
  }

  location = /version {
    proxy_pass http://api_backend/version;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
  }

  location = /catalog {
    return 308 https://serve.hh88trance.com$request_uri;
  }

  location ^~ /buy/ {
    return 308 https://serve.hh88trance.com$request_uri;
  }

  location ^~ /telegram/ {
    return 308 https://serve.hh88trance.com$request_uri;
  }

  location ^~ /stripe/ {
    return 308 https://serve.hh88trance.com$request_uri;
  }

  location ^~ /dl/ {
    return 308 https://serve.hh88trance.com$request_uri;
  }

  location ^~ /download-file/ {
    return 308 https://serve.hh88trance.com$request_uri;
  }

  location = /success {
    return 308 https://serve.hh88trance.com$request_uri;
  }

  location = /cancel {
    return 308 https://serve.hh88trance.com$request_uri;
  }

  location ^~ /admin {
    return 308 https://admin.hh88trance.com$request_uri;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

