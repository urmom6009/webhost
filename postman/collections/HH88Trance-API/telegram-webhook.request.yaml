$kind: http-request
name: Telegram Webhook
method: POST
url: '{{baseUrl}}/telegram/webhook/{{telegramWebhookSecret}}'
order: 5000
headers:
  - key: x-telegram-bot-api-secret-token
    value: '{{telegramWebhookSecret}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"update_id": 1, "message": {"message_id": 1, "chat": {"id": 123, "type": "private"}, "text": "/start"}}
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        // 200 = valid secret + update processed; 403 = wrong/missing secret
        pm.test("Status is 200 or 403", () => {
          pm.expect(pm.response.code).to.be.oneOf([200, 403]);
        });

        pm.test("Response is JSON", () => {
          pm.response.to.be.json;
        });

        if (pm.response.code === 200) {
          pm.test("Successful response has ok: true", () => {
            const json = pm.response.json();
            pm.expect(json).to.have.property("ok");
            pm.expect(json.ok).to.be.true;
          });
        }

        if (pm.response.code === 403) {
          pm.test("Forbidden response has detail field", () => {
            const json = pm.response.json();
            pm.expect(json).to.have.property("detail");
            pm.expect(json.detail).to.be.a("string").and.not.empty;
          });
        }